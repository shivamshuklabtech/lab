<!DOCTYPE html>
<html>
<head>
<title>Simple ToDo</title>
<style>
body{
    font-family: Arial;
    background:#f2f2f2;
}
.box{
    width:300px;
    margin:80px auto;
    background:white;
    padding:20px;
    text-align:center;
}
input{
    width:70%;
    padding:5px;
}
button{
    padding:6px;
}
li{
    text-align:left;
}
</style>
</head>

<body>

<div class="box">
    <h3>To Do List</h3>
    <input id="task" placeholder="Enter task">
    <button onclick="add()">Add</button>

    <ul id="list"></ul>
</div>

<script>
function add(){
    var task = document.getElementById("task").value;
    if(task=="") return;

    var li = document.createElement("li");
    li.innerHTML = task;
    document.getElementById("list").appendChild(li);
    document.getElementById("task").value="";
}
</script>

</body>
</html>
